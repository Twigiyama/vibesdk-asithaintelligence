name: Sync secrets

# Manual only. Pushes the WORKER_SECRETS environment secret (a JSON object of
# secret name to value) to the production Worker. Additive: secrets that are not
# listed stay as they are. The default is a dry run that prints names only.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the secrets. Leave off for a dry run.
        type: boolean
        default: false
      allow_delete:
        description: Let a null value in WORKER_SECRETS delete that secret.
        type: boolean
        default: false
      allow_missing_worker:
        description: Allow creating a draft Worker to hold the secrets before the first deploy.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HUSKY: '0'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  sync:
    name: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require a run from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $WORKFLOW_REF)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/require-environment
        with:
          token-set: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ vars.WORKER_NAME }}
          worker-secrets-set: ${{ secrets.WORKER_SECRETS != '' }}

      - uses: ./.github/actions/setup-toolchain

      - name: Sync secrets
        env:
          WORKER_SECRETS: ${{ secrets.WORKER_SECRETS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          APPLY: ${{ inputs.apply }}
          ALLOW_DELETE: ${{ inputs.allow_delete }}
          ALLOW_MISSING_WORKER: ${{ inputs.allow_missing_worker }}
        run: |
          args=(--config wrangler.jsonc)
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          if [ "$ALLOW_DELETE" = "true" ]; then
            args+=(--allow-delete)
          fi
          if [ "$ALLOW_MISSING_WORKER" = "true" ]; then
            args+=(--allow-missing-worker)
          fi
          bun scripts/ci/sync-secrets.ts "${args[@]}"

      # The script removes its own temporary file; this is the backstop.
      - name: Remove temporary secret files
        if: always()
        run: rm -f "$RUNNER_TEMP"/worker-secrets-*.json
